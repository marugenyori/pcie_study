<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCIe学習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- 広い画面では左のメニュー、狭い画面では下のタブ -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/"><span class="brand-mark">⚡</span><span>PCIe学習</span></a>
      <nav class="nav">
        <a href="#/" data-match="^#?/?$" class="tab"><span class="ico">🔥</span><span>今日</span></a>
        <div class="nav-group">学ぶ</div>
        <a href="#/learn" data-match="^#/(learn|chapters|chapter|columns|column|glossary|news)" class="tab"><span class="ico">📖</span><span>章と読みもの</span></a>
        <a href="#/quiz" data-match="^#/(quiz|game)" class="tab"><span class="ico">✅</span><span>クイズ</span></a>
        <a href="#/diagrams" data-match="^#/diagram"><span class="ico">🧩</span><span>図解</span></a>
        <a href="#/tools" data-match="^#/(tools|tool/)"><span class="ico">🧮</span><span>ツール</span></a>
        <div class="nav-group">英語</div>
        <a href="#/english" data-match="^#/english" class="tab"><span class="ico">🎧</span><span>英語で聞く</span></a>
        <a href="#/clips" data-match="^#/clip"><span class="ico">🎬</span><span>配信で英語</span></a>
        <a href="#/phrases" data-match="^#/phrases"><span class="ico">📝</span><span>フレーズ帳</span></a>
        <div class="nav-group">そのほか</div>
        <a href="#/ask" data-match="^#/ask" class="tab"><span class="ico">💬</span><span>質問する</span></a>
        <a href="#/settings" data-match="^#/settings"><span class="ico">⚙️</span><span>表示の設定</span></a>
      </nav>
      <div class="sync-box"><span class="dot" id="sync-dot"></span><span id="sync-status" class="sync">同期を確認中…</span></div>
    </aside>

    <div class="content">
      <div class="pagebar" id="pagebar">
        <button class="back" onclick="history.back()" aria-label="前の画面に戻る">‹ 戻る</button>
        <span class="crumb" id="crumb"></span>
        <button class="menu-btn" id="menu-btn" aria-label="メニュー">☰ メニュー</button>
      </div>
      <main id="app"><p class="muted">読み込み中…</p></main>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="extra.js"></script>
  <script src="visual.js"></script>
  <script src="clipextra.js"></script>
</body>
</html>
