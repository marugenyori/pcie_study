name: ブラウザ版のデータを書き出す

# アプリの学習データ（章・クイズ・英語レッスンなど）が変わったら、ブラウザ版用の web/content.json を作り直して main に入れる
on:
  push:
    branches: [main]
    paths:
      - "Shared/**"
      - "PCIeStudy/Data/**"
      - "scripts/export/**"
      - ".github/workflows/export-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-content
  cancel-in-progress: true

jobs:
  export:
    name: content.json を作る
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 書き出し
        run: |
          swiftc -O \
            Shared/LessonModels.swift Shared/LessonData*.swift \
            Shared/QuizData*.swift Shared/QuizNotes*.swift Shared/QuizDetails*.swift \
            Shared/StudyStats.swift \
            PCIeStudy/Data/*.swift \
            scripts/export/main.swift \
            -o "$RUNNER_TEMP/export"
          "$RUNNER_TEMP/export" web/content.json

      - name: 変わっていれば main に入れる
        run: |
          if git diff --quiet -- web/content.json && git ls-files --error-unmatch web/content.json >/dev/null 2>&1; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content.json
          git commit -m "Update web/content.json from the app data"
          git push origin HEAD:main
